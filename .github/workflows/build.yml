name: Build NOVA CLIENT

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os: windows
          - platform: macos-latest
            os: macos
          - platform: ubuntu-22.04
            os: linux
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf
      - run: npm install
      - run: npm run tauri -- build
      - uses: actions/upload-artifact@v4
        with:
          name: nova-client-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
      - name: Publish draft release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          files: src-tauri/target/release/bundle/**/*

  fabric-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Fabric mod
        working-directory: nova-fabric
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: nova-client-fabric-1.21.4
          path: nova-fabric/build/libs/*-all.jar
          if-no-files-found: error
