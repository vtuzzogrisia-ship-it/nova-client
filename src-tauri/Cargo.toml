[package]
name = "nova-client"
version = "0.1.0"
description = "NOVA CLIENT desktop launcher"
authors = ["NOVA CLIENT"]
edition = "2021"

[lib]
name = "nova_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde_json = "1"
sha1 = "0.10"

base64 = "0.22"
